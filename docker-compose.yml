services:
  claude-code:
    build:
      # context stays at the repo root — the Dockerfile COPYs
      # scripts/container/entrypoint.sh, which lives above docker/.
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Set CC_INSTALL_VSCODE_EXTENSION=1 in .env and run ccupdate to bake the
        # Claude Code VS Code extension into the image. Off by default because it
        # adds ~670 MB — the extension ships its own copy of the Claude binary,
        # which this image already installs. See .env.example.
        INSTALL_VSCODE_EXTENSION: ${CC_INSTALL_VSCODE_EXTENSION:-0}
    container_name: cc-install
    image: cc-install:latest

    # Reap zombie processes. code-server and claude both spawn children.
    init: true

    volumes:
      # Your files. Directly visible on the host — in ./workspace by default, or
      # wherever CC_WORKSPACE points if you've run `ccpath`.
      #
      # Quoted because a relocated path may contain spaces. The container side
      # never changes, so nothing inside the image cares where this comes from.
      # Compose reads CC_WORKSPACE from the shell environment first, then .env;
      # scripts/lib/workspace.sh resolves it the same way so the two can't drift.
      - "${CC_WORKSPACE:-./workspace}:/home/claudeuser/workspace"
      # Claude Code config + credentials + skills. Survives rebuilds.
      - claude-config:/home/claudeuser/.claude
      # code-server settings and extensions. Survives rebuilds.
      - code-server-data:/home/claudeuser/.local/share/code-server

    ports:
      # Published on 8088, not 8080. 8080 is heavily contended — local dev
      # servers and local LLM servers both default to it, and a collision is
      # worse than an inconvenience: tooling that probes "is anything on this
      # port?" will misreport, and some of it kills whatever holds the port.
      # The container still listens on 8080 internally; only the host side moved.
      #
      # Bound to 127.0.0.1 on purpose. code-server runs with --auth none by
      # default, so publishing on 0.0.0.0 would hand anyone on your network a
      # shell in this container. Loopback-only means only this machine can
      # reach it. See docs/CREDENTIALS.md if you need network access.
      - "127.0.0.1:8088:8080"

    # Credentials live in .env (written by scripts/installers/setup-credentials.sh,
    # a.k.a. `ccauth`). required: false so the container still starts before
    # you've set one up — you can also sign in interactively with `claude`.
    #
    # .env is the ONLY source of credentials, deliberately. Do NOT add bare
    # passthrough entries like `- ANTHROPIC_API_KEY` to `environment` below:
    #   * `environment` takes precedence over `env_file`, and a bare entry whose
    #     variable is unset on the host resolves to null — which SHADOWS the
    #     .env value and leaves it unset in the container. That silently breaks
    #     ccauth completely.
    #   * If the variable IS set on the host, it overrides .env just as silently.
    #     Anyone who exports AWS_PROFILE or CLAUDE_CODE_USE_BEDROCK for their own
    #     work would have those leak in and defeat whatever ccauth configured.
    # Both were verified against Docker Compose, not assumed.
    env_file:
      - path: .env
        required: false

    environment:
      - CODE_SERVER_CONFIG=/home/claudeuser/.config/code-server/config.yaml

    # Resource limits (tune for the host laptop)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

    # Idle forever; the launchers `docker compose exec` into it.
    command: ["sleep", "infinity"]

    restart: unless-stopped

volumes:
  claude-config:
    driver: local
  code-server-data:
    driver: local
