document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Libre Franklin';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c950ed19-6025-40f7-9e3b-5cfac5347da8\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\ndoc-page:not(:defined){visibility:hidden}\nbody{margin:0}\na{color:#495E9D;text-decoration:none}\na:hover{color:#232D4B}\n<\u002Fstyle>\n<script src=\"3a264f45-09f2-474f-bd68-dfad815bf0e1\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"letter\">\n<section class=\"page\" style=\"font-family:'Libre Franklin',Helvetica,Arial,sans-serif;color:#232D4B;background:#ffffff;padding:0.5in 0.55in 0.4in;display:flex;flex-direction:column;gap:13px;box-sizing:border-box\">\n\n  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid #232D4B;padding-bottom:9px\">\n    <div style=\"display:flex;flex-direction:column;gap:3px\">\n      \n      <div style=\"font-size:27px;font-weight:800;letter-spacing:-0.6px;line-height:1\">Claude Code — Get Started<\u002Fdiv>\n      <div style=\"font-size:10.5px;color:#666666;font-weight:500\">Install once, in about 20 minutes. No coding or Docker knowledge required.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"text-align:right;font-size:8px;line-height:1.45;color:#666666;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;flex-shrink:0\">\n      Visual Guide<br>Rev. Aug 2026 &#183; v1.3.2\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:9px;background:#F1F1EF;border-left:4px solid #E57200;padding:9px 12px;align-items:center\">\n    <div style=\"font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#E57200;flex-shrink:0\">Before you start<\u002Fdiv>\n    <div style=\"font-size:10px;line-height:1.4;color:#232D4B\">Request your <strong>UVA Amazon Bedrock credentials<\u002Fstrong> from Batten IT now — you'll need them at Step 3, and usage is billed to the University, not to you.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:11px\">\n    <div style=\"border:1px solid #DADADA;border-top:4px solid #232D4B;padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:19px;height:19px;border-radius:50%;background:#232D4B;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0\">1<\u002Fspan><span style=\"font-size:13.5px;font-weight:700\">Install Docker Desktop<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:9.5px;line-height:1.45;color:#333\">Download from <strong>docker.com/products/docker-desktop<\u002Fstrong> — pick Apple&nbsp;chip / Intel / Windows. Accept the defaults; on Windows allow <strong>WSL 2<\u002Fstrong> and restart if asked.<\u002Fdiv>\n      <div style=\"font-size:9px;line-height:1.4;color:#666666;border-top:1px dotted #DADADA;padding-top:5px\">Open Docker Desktop and wait for <em>“Docker Desktop is running”<\u002Fem> (whale icon) before Step 2.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #DADADA;border-top:4px solid #232D4B;padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:19px;height:19px;border-radius:50%;background:#232D4B;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0\">2<\u002Fspan><span style=\"font-size:13.5px;font-weight:700\">Run one command<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:#E57200\">macOS — Terminal app<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:7.4px;line-height:1.5;background:#232D4B;color:#fff;padding:6px 7px;word-break:break-all\">curl -fsSL https://raw.githubusercontent.com/wmo4buva/cc-install/main/scripts/installers/install.sh -o install.sh &amp;&amp; bash install.sh<\u002Fdiv>\n      <div style=\"font-size:9px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:#E57200\">Windows — PowerShell only<\u002Fdiv>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:7.4px;line-height:1.5;background:#232D4B;color:#fff;padding:6px 7px;word-break:break-all\">irm https://raw.githubusercontent.com/wmo4buva/cc-install/main/scripts/installers/install.ps1 | iex<\u002Fdiv>\n      <div style=\"font-size:9px;line-height:1.4;color:#666666\">Takes 10–15 min. Scrolling text is normal; wait for the green <strong>Installation Complete!<\u002Fstrong><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #DADADA;border-top:4px solid #232D4B;padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:19px;height:19px;border-radius:50%;background:#232D4B;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0\">3<\u002Fspan><span style=\"font-size:13.5px;font-weight:700\">New terminal, then sign in<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:9.5px;line-height:1.45;color:#333\">Close the old window first — the shortcuts only appear in a fresh one. Then type <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;background:#F9DCBF;padding:1px 4px;font-weight:600\">ccauth<\u002Fspan> and choose option <strong>3 — Amazon Bedrock<\u002Fstrong> (the UVA option, billed to the University). Enter the Access Key ID and Secret Access Key from Batten IT — <strong>nothing appears as you type or paste; that&#39;s normal<\u002Fstrong>. Press Enter to accept region <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px\">us-east-1<\u002Fspan>, then press Enter <strong>twice more<\u002Fstrong> to skip the optional session token and model ID.<\u002Fdiv>\n      <div style=\"font-size:9px;line-height:1.4;color:#666666;border-top:1px dotted #DADADA;padding-top:5px\"><strong>“command not found”?<\u002Fstrong> You're still in the old terminal window. Sign-in is once only and survives updates.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"border:1px solid #DADADA;border-top:4px solid #232D4B;padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px\">\n      <div style=\"display:flex;align-items:center;gap:7px\"><span style=\"width:19px;height:19px;border-radius:50%;background:#232D4B;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0\">4<\u002Fspan><span style=\"font-size:13.5px;font-weight:700\">Launch Claude Code<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:9.5px;line-height:1.45;color:#333\">Type <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;background:#F1F1EF;padding:1px 4px;font-weight:600\">ccdocker<\u002Fspan> for Claude Code in your terminal, or <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;background:#F1F1EF;padding:1px 4px;font-weight:600\">ccvscode<\u002Fspan> for the browser-based editor at <strong>localhost:8080<\u002Fstrong>.<\u002Fdiv>\n      <div style=\"font-size:9px;line-height:1.4;color:#666666;border-top:1px dotted #DADADA;padding-top:5px\">Your sign-in applies to both, so either one just works.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:1.05fr 1fr;gap:11px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#232D4B;border-bottom:2px solid #E57200;padding-bottom:3px\">Commands — work from anywhere<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-size:9.3px;line-height:1.72\">\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccauth<\u002Fspan><span style=\"color:#333\">Set up or change how you sign in<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccdocker<\u002Fspan><span style=\"color:#333\">Launch Claude Code in the terminal<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccvscode<\u002Fspan><span style=\"color:#333\">Launch the browser editor (localhost:8080)<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccstop<\u002Fspan><span style=\"color:#333\">Stop it when you're done for the day<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccrestart<\u002Fspan><span style=\"color:#333\">Restart if something seems stuck<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccdiagnose<\u002Fspan><span style=\"color:#333\">Check your install and get fixes<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccbackup<\u002Fspan><span style=\"color:#333\">Back up your workspace<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccupdate<\u002Fspan><span style=\"color:#333\">Update everything (10–15 min, keeps your files)<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">cclogs<\u002Fspan><span style=\"color:#333\">Show technical logs for troubleshooting<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:2px;background:#232D4B;color:#fff;padding:9px 11px;display:flex;flex-direction:column;gap:3px\">\n        <div style=\"font-size:9.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:#F9DCBF\">In the browser editor<\u002Fdiv>\n        <div style=\"font-size:9.3px;line-height:1.45\">There is <strong>no Claude Code button<\u002Fstrong>. Choose <strong>Terminal → New Terminal<\u002Fstrong>, type <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">claude<\u002Fspan>, press Enter. Same sign-in as the terminal. <strong>Extensions<\u002Fstrong> install from the Extensions panel (Ctrl+Shift+X) and persist across updates \u2014 the Claude Code extension is optional, and lives in a different store (Open VSX) than desktop VS Code.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#232D4B;border-bottom:2px solid #E57200;padding-bottom:3px\">If something goes wrong<\u002Fdiv>\n      <div style=\"font-size:9.3px;line-height:1.45;color:#333;background:#F9DCBF;padding:6px 9px\"><strong>Always run <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccdiagnose<\u002Fspan> first.<\u002Fstrong> It checks Docker, ports, disk space and your sign-in, then tells you the fix.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr;gap:5px;font-size:9.2px;line-height:1.4\">\n        <div style=\"border-left:2px solid #C8CBD2;padding-left:8px\"><strong>“Docker daemon is not running”<\u002Fstrong><br><span style=\"color:#666666\">Open Docker Desktop, wait until it says running.<\u002Fspan><\u002Fdiv>\n        <div style=\"border-left:2px solid #C8CBD2;padding-left:8px\"><strong>Install command doesn't work on Windows<\u002Fstrong><br><span style=\"color:#666666\">Use PowerShell, not Command Prompt.<\u002Fspan><\u002Fdiv>\n        <div style=\"border-left:2px solid #C8CBD2;padding-left:8px\"><strong>Browser editor won't open<\u002Fstrong><br><span style=\"color:#666666\">Wait ~10s, then visit localhost:8080 manually.<\u002Fspan><\u002Fdiv>\n        <div style=\"border-left:2px solid #C8CBD2;padding-left:8px\"><strong>“Port 8080 already allocated”<\u002Fstrong><br><span style=\"color:#666666\">Run ccdiagnose, or contact Batten IT.<\u002Fspan><\u002Fdiv>\n        <div style=\"border-left:2px solid #C8CBD2;padding-left:8px\"><strong>Keeps asking you to sign in<\u002Fstrong><br><span style=\"color:#666666\">Run ccdiagnose, then ccauth.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:6px;flex:1;min-height:0\">\n    <div style=\"font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:#232D4B;border-bottom:2px solid #E57200;padding-bottom:3px\">Using it day to day<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:11px;flex:1\">\n      <div style=\"background:#F1F1EF;padding:9px 11px;display:flex;flex-direction:column;gap:4px\">\n        <div style=\"font-size:10.5px;font-weight:700\">Just talk to it<\u002Fdiv>\n        <div style=\"font-size:9.4px;line-height:1.5;color:#333\">Type what you want in plain English — <em>“summarize the CSV in my workspace”<\u002Fem> or <em>“draft a Python script to rename these files.”<\u002Fem> Claude Code reads, writes and edits files for you.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F1F1EF;padding:9px 11px;display:flex;flex-direction:column;gap:4px\">\n        <div style=\"font-size:10.5px;font-weight:700\">Skills are pre-installed<\u002Fdiv>\n        <div style=\"font-size:9.4px;line-height:1.5;color:#333\">Type <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">/skills<\u002Fspan> inside Claude Code to see the skill packs already included, and <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">/help<\u002Fspan> for commands.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F1F1EF;padding:9px 11px;display:flex;flex-direction:column;gap:4px\">\n        <div style=\"font-size:10.5px;font-weight:700\">Update safely<\u002Fdiv>\n        <div style=\"font-size:9.4px;line-height:1.5;color:#333\">Back up first, then update: <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccbackup<\u002Fspan> → <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">ccupdate<\u002Fspan>. Your workspace and sign-in are untouched.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #DADADA;padding:8px 10px;font-size:9.4px;line-height:1.5;color:#333\">\n      <strong style=\"color:#232D4B\">Your files &amp; your own projects:<\u002Fstrong> everything lives in <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">cc-install/workspace/<\u002Fspan> — a normal folder you can open, drag files into, and back up. To work on a project you already have, <strong>drag its folder into <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">workspace/<\u002Fspan><\u002Fstrong> — it appears instantly, no restart. In the browser editor use <strong>File → Open Folder<\u002Fstrong> → <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px\">/home/claudeuser/workspace/your-folder<\u002Fspan>. Shortcuts and aliases pointing outside <span style=\"font-family:'IBM Plex Mono',monospace;font-weight:600\">workspace/<\u002Fspan> will not work — copy the real folder in.\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:3px solid #232D4B;padding-top:7px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:8.5px;color:#666666\">\n    <div><strong style=\"color:#232D4B;font-size:9.5px\">Need help?<\u002Fstrong> Contact <strong style=\"color:#232D4B\">Batten IT<\u002Fstrong> — include your OS (Mac/Windows) and the <span style=\"font-family:'IBM Plex Mono',monospace\">ccdiagnose<\u002Fspan> output or a screenshot.<\u002Fdiv>\n    <div style=\"flex-shrink:0;text-align:right\">Full detail: INSTALL_GUIDE.md · QUICK_REFERENCE.md · CREDENTIALS.md<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
